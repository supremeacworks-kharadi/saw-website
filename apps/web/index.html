		<style>
			/* First-load branded splash. Pure CSS, paints before the JS bundle,
			   self-dismisses on window load or a hard cap — never adds artificial delay. */
			#saw-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0b1220;
				opacity: 1;
				transition: opacity 0.4s ease;
			}
			#saw-splash.saw-splash--hide {
				opacity: 0;
				pointer-events: none;
			}
			#saw-splash .saw-splash__ring {
				position: relative;
				width: 96px;
				height: 96px;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			#saw-splash .saw-splash__ring::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: 50%;
				border: 3px solid rgba(255, 255, 255, 0.12);
				border-top-color: #e11d2a;
				animation: saw-splash-spin 0.9s linear infinite;
			}
			#saw-splash .saw-splash__logo {
				width: 56px;
				height: 56px;
				object-fit: contain;
				animation: saw-splash-pulse 1.4s ease-in-out infinite;
			}
			@keyframes saw-splash-spin {
				to { transform: rotate(360deg); }
			}
			@keyframes saw-splash-pulse {
				0%, 100% { transform: scale(0.94); opacity: 0.85; }
				50% { transform: scale(1); opacity: 1; }
			}
			@media (prefers-reduced-motion: reduce) {
				#saw-splash .saw-splash__ring::before,
				#saw-splash .saw-splash__logo {
					animation: none;
				}
			}
		</style>

		<div id="saw-splash" role="status" aria-label="Loading Supreme AC Works">

		<script>
			// Show the splash only once per browser session.
			(function () {
				var splash = document.getElementById('saw-splash');
				if (!splash) return;

				var STORAGE_KEY = 'saw-splash-shown';
				var seen = false;
				try { seen = sessionStorage.getItem(STORAGE_KEY) === '1'; } catch (e) {}

				if (seen) {
					// Repeat visit this session: remove instantly, no animation, no delay.
					splash.parentNode && splash.parentNode.removeChild(splash);
					return;
				}

				try { sessionStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}

				var dismissed = false;
				function dismiss() {
					if (dismissed) return;
					dismissed = true;
					splash.classList.add('saw-splash--hide');
					window.setTimeout(function () {
						splash.parentNode && splash.parentNode.removeChild(splash);
					}, 450);
				}

				// Whichever comes first: app/window ready, or a hard 900ms cap.
				if (document.readyState === 'complete') {
					dismiss();
				} else {
					window.addEventListener('load', dismiss, { once: true });
				}
				window.setTimeout(dismiss, 900);
			})();
		</script>
